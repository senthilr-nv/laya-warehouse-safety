[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-warehouse-safety"
version = "0.1.0"
description = "A visual warehouse safety simulation driven by Laya typed decisions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Senthil Ramadurai" }]
dependencies = []

[project.optional-dependencies]
visual = ["pygame>=2.6,<3"]
laya = ["laya>=0.3.3"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
laya-warehouse = "laya_warehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

